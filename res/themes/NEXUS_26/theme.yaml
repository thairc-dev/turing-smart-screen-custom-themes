---
author: "ThaiRC (thairc-dev)"
version: "1.0.0"
license: "GPL-3.0-or-later"
renderer: "python -m nexus26"
portable_config: "config.yaml"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 168, 85, 247

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 38
        Y: 62
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png

  MEMORY:
    INTERVAL: 2
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 38
        Y: 158
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 22
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
