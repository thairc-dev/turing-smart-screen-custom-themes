---
author: "Antigravity Custom"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 229, 255

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      RADIAL:
        SHOW: True
        X: 122
        Y: 115
        RADIUS: 38
        WIDTH: 6
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 128
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 0, 128
        BACKGROUND_IMAGE: background.png

  MEMORY:
    INTERVAL: 2
    VIRTUAL:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 122
        Y: 208
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 0, 229, 255
        BACKGROUND_IMAGE: background.png
      GRAPH:
        SHOW: True
        X: 30
        Y: 250
        WIDTH: 184
        HEIGHT: 12
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 0, 229, 255
        BAR_OUTLINE: True
        BACKGROUND_COLOR: 10, 14, 23

  DISK:
    INTERVAL: 5
    USED:
      PERCENT_TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 358
        Y: 78
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 139, 92, 246
        BACKGROUND_IMAGE: background.png
      GRAPH:
        SHOW: True
        X: 266
        Y: 112
        WIDTH: 184
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 139, 92, 246
        BAR_OUTLINE: True
        BACKGROUND_COLOR: 10, 14, 23

  NET:
    INTERVAL: 1
    ETH:
      UPLOAD:
        TEXT:
          SHOW: True
          X: 266
          Y: 168
          FONT: roboto/Roboto-Bold.ttf
          FONT_SIZE: 13
          FONT_COLOR: 16, 185, 129
          BACKGROUND_IMAGE: background.png
      DOWNLOAD:
        TEXT:
          SHOW: True
          X: 266
          Y: 192
          FONT: roboto/Roboto-Bold.ttf
          FONT_SIZE: 13
          FONT_COLOR: 16, 185, 129
          BACKGROUND_IMAGE: background.png

  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        SHOW: True
        X: 266
        Y: 252
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 245, 158, 11
        BACKGROUND_IMAGE: background.png
    HOUR:
      TEXT:
        SHOW: True
        X: 266
        Y: 274
        FONT: roboto/Roboto-Bold.ttf
        FONT_SIZE: 15
        FONT_COLOR: 245, 158, 11
        BACKGROUND_IMAGE: background.png
